data_provider:
  rrc_config:
    test_crop_ratio: 0.95
  n_worker: 8
  total_batch_size: 512

net_config:
  name: b0
  dropout: 0
  bb_convattention: True
  bb_convin2: True
  grouping: 2
  smallk_only_lasts: True
  lose_transpose: True
  fastit: True
  fastitv2: False
  bigit: False
  smallv2: True
  smallv3: True
  model_mult: 1.0
  full_norm: True

  head_dim_mul: False
  actit: False


run_config:
  n_epochs: 300
  bsizemult: 1
  total_lr: 0.001
  bf16_retrain: true
